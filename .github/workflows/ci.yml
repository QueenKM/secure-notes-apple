name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Swift package tests
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate and build the iOS simulator app
        run: |
          xcodegen generate
          xcodebuild -project SecureNotes.xcodeproj -scheme SecureNotes -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
